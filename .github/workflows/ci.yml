name: ci

on:
  push:
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Import check
        working-directory: backend
        run: |
          python -c "import langchain, langchain_core, langchain_openai, langgraph, langsmith; print('langchain-imports-ok')"
          python -c "from app.core import graph; from app.core.graph import AgentRuntime, AGENT_TOOLS; from app.services import syndrome_service; from app.api import clinical; print('app-imports-ok')"

      - name: Offline unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v